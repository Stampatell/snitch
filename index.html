<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ececf0"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Snitch&Impicci"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

:root{--o:#d2315a;--ink:#16161a;--bg:#ececf0;--m:#6b6b76;--g:#1b7f4b;--r:#b3261e;--in:#f4f3f6;--y:#f2c04a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none}html{background:var(--bg);color-scheme:light}
body{font:16px/1.35 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);padding:env(safe-area-inset-top,0px) 0 calc(112px + env(safe-area-inset-bottom,0px))}
main{padding:0 18px;max-width:640px;margin:0 auto}
button{font:inherit;font-weight:700;border:0;border-radius:28px;min-height:52px;padding:0 18px;background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3b7dd8;outline-offset:2px}
.mg,.sv{background:var(--o);color:#fff}.dk{background:var(--ink);color:#fff}.gr{background:#fff;color:var(--ink)}.rd{background:#fcecea;color:var(--r)}.ghost{background:#fff;color:var(--o)}.lk{background:#fff;color:var(--o);margin-top:8px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{display:block;height:15px;width:auto;max-width:62%;fill:var(--o);margin:22px 0 0}.top{display:flex;align-items:center;gap:12px;padding:12px 0 14px}.top h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
.bk{width:44px;min-height:44px;height:44px;padding:0;border-radius:22px;flex:none}
.top .dot{width:auto;min-height:36px;padding:0 4px;background:none;font-size:15px;font-weight:600;color:var(--m);flex:none}.dot::before{content:"\25CF";margin-right:6px;font-size:12px}
.top .dot.ok{color:#3d5f49}.top .dot.warn{color:#9a6b00}.top .dot.bad{background:var(--ink);color:#fff;padding:0 12px}
h3{display:flex;justify-content:space-between;align-items:baseline;margin:24px 6px 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--m)}
.c{background:#fff;border-radius:22px;padding:14px 18px;margin:8px 0}
.c small{display:block;color:var(--m);font-size:14px}.c>b{font-size:22px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.g .c{margin:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}.it>span{min-width:0}.it>span>b{font-size:17px}.it em{display:block;font-style:normal;color:var(--m);font-size:14px;margin-top:1px}.it>b{font-size:17px;white-space:nowrap}
.rt2{text-align:right}
.tag{background:var(--ink);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}.r+.r{border-top:1px solid var(--bg)}
.ok{color:var(--g)}.rdt{color:var(--r)}.note{color:var(--m);font-size:14px;margin:10px 6px}
.pair{display:flex;gap:10px;margin:8px 0}.pair button{flex:1}
.srch{background:#fff;border-radius:28px;min-height:52px;padding:0 20px;margin:0 0 12px}
.hero,.hb0{border-radius:28px;padding:22px 24px;margin:4px 0 12px;text-align:left}
.hero small,.hb0 small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero>b,.hb0>b{display:block;font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hb0{background:var(--ink);color:#fff;display:block;min-height:0;font-weight:400;width:100%}
.hb0 small{color:#d4d4d8}.hb0>b.neg{color:#ff8aab}
.hb0 .hr{display:flex;gap:24px;font-size:13px;color:#d4d4d8;margin-top:8px}.hb0 .hr b{display:block;font-size:16px;color:#fff}.hb0 .cap{display:block;color:#d4d4d8;font-size:15px}
.hb0.pr{padding:6px 22px}.pr .r+.r{border-color:#ffffff24}.pr .r:last-child{color:#ff8aab;font-weight:700;font-size:18px}
.hp{background:var(--o);color:#fff}.hp small{opacity:.95}
.hy{background:var(--y);color:var(--ink)}.hy span{font-size:16px}
.ch{display:flex;gap:8px;margin-top:12px}.ch span{flex:1;background:#ffffff2e;border-radius:14px;padding:8px 12px;font-size:12px}.ch b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.x3{margin-top:10px;background:#ffffff2e;border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.x3 b{display:block;font-size:17px;line-height:1.2}.x3 .r3{text-align:right;font-size:12px}.x3 .r3 b{font-size:26px;letter-spacing:-.02em}
.th{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.th button{background:#fff;border-radius:26px;padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-weight:400}
.th button.p{background:var(--o);color:#fff}.th svg.ic{width:26px;height:26px}.th b{display:block;font-size:19px}.th em{display:block;font-style:normal;font-size:14px;opacity:.85}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:6;background:linear-gradient(#ececf000,var(--bg) 38%)}
.bar[hidden]{display:none}.bar button{flex:1;min-height:56px}
.dc{display:block;text-align:center;padding:20px 18px}
.dnb{width:auto;min-height:0;background:none;padding:0;margin:0 auto;display:block;border-radius:50%}
.dn{display:grid;width:190px;height:190px;border-radius:50%;place-items:center}
.hole{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-content:center;color:var(--m);font-size:13px}.hole b{display:block;font-size:20px;color:var(--ink)}
.hint{color:var(--m);font-size:13px;margin:10px 0 0}
.lg{flex:1;min-width:0}.lg>div{display:flex;align-items:center;gap:10px;padding:5px 0}.lg span{flex:1;min-width:0}.lg small{display:block;font-size:12px;color:var(--m)}.dt{display:block;width:14px;height:14px;border-radius:50%;flex:none}
.rt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rt .c{margin:0}.rt h4{margin:0 0 4px;font-size:15px}
#sh{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}#sh[hidden]{display:none}
.box{overscroll-behavior:contain;background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.box::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#d9d6d1;margin:0 auto 12px}
.box h2{margin:0 0 10px;font-size:22px}.box button{margin-top:8px}.box .gr{background:var(--bg)}.box .c{background:var(--in);margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--m)}
input,select{font:inherit;width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--in);margin:4px 0 10px;min-height:48px;color:var(--ink)}
.srch{background:#fff;border-radius:28px;min-height:52px;padding:0 20px;margin:0 0 12px}
label.chk{display:flex;gap:12px;align-items:center;font-size:17px;color:var(--ink);background:var(--in);border-radius:14px;padding:14px;margin:4px 0 12px}label.chk input{width:26px;height:26px;margin:0;min-height:0}
.calc b{font-size:18px}
.big{text-align:center;padding:40px 10px}.big p{color:var(--m)}.big button{margin-top:10px}
.warn{background:#fcecea!important}.warn p{margin:4px 0;color:var(--r)}
.pn{background:#fff;border-radius:22px;margin:8px 0;overflow:hidden}.pn>.ph{background:none;border-radius:0;justify-content:space-between;min-height:56px;padding:0 18px;font-weight:700;font-size:17px;text-align:left}.ph small{font-weight:400;color:var(--m);font-size:15px}.ph b{color:var(--m);font-weight:600}
.pn .in{padding:0 12px 12px}.pn .in .c{background:var(--in);margin:6px 0}.pn .in>.r{padding:10px 6px}.lg{text-align:left;margin-top:12px}
